# Nginx configuration for ChangeLens frontend

server {
  listen 80;
  server_name _;

  # Serve static files with proper cache headers
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # API: same origin as the app, so the browser needs no CORS and the client uses the relative URL /api.
  # Resolved when the request is made (not at startup), so nginx still boots if the backend is not up yet.
  # An AI investigation can run for OLLAMA_TIMEOUT_MS (120 s by default); 180 s leaves headroom.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://backend:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 180s;
    proxy_send_timeout 60s;
    client_max_body_size 2m;
  }

  # SPA routing: all requests go to index.html except for assets
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache assets with content hash
  location ~* ^/assets/.*\.[a-f0-9]+\.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Don't cache index.html
  location = /index.html {
    expires -1;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
  }

  # Block access to dotfiles
  location ~ /\. {
    deny all;
  }
}
